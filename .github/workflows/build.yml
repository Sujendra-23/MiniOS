name: Build and boot MiniOS
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build the Linux toolchain
        run: docker build --platform linux/amd64 -t minios-tools .
      - name: Build ISO and test allocator, preemption, paging, and IRQs
        run: docker run --rm --platform linux/amd64 -v "$GITHUB_WORKSPACE:/work" minios-tools
      - uses: actions/upload-artifact@v4
        with:
          name: minios
          path: |
            os.iso
            build/kernel.elf
